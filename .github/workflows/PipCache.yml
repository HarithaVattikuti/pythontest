name: Python pip cache key testing

on:
  workflow_dispatch:

jobs:
  cachepipv5:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: "windows-latest"
            architecture: "x64"
          - os: "ubuntu-latest"
            architecture: "x64"
          - os: "ubuntu-24.04"
            architecture: "x64"
          - os: "windows-latest"
            architecture: "x86"
          - os: "macos-latest"
            architecture: "arm64"
          - os: "macos-13"
            architecture: "x64"
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        #uses: Zxilly/setup-python@main
        id: setup-python
        with:
          # python-version: "3.13.1"
          # architecture: ${{ matrix.target.architecture }}
          cache: "pip"
