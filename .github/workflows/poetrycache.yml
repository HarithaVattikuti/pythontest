name: Test poetry cache

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'poetry'
      - name: poetry use
        run: poetry env use ${{ steps.setup-python.outputs.python-path }}
      - run: poetry install
     # - run: poetry run pytest
      
