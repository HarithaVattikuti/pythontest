name: Install and Verify Python 3.12.10 arm64

on:
  workflow_dispatch:

jobs:
  install-python-x64:
    runs-on: windows-latest
    steps:
      - name: Download Python 3.12.10 x64 installer
        run: |
          curl -O https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe
          dir

      - name: Install Python 3.12.10 x64 for current user (no elevation)
        shell: pwsh
        run: |
          $installer = "python-3.12.10-amd64.exe"
          $installerPath = Join-Path $PWD $installer
          $userPythonDir = "$env:USERPROFILE\AppData\Local\Programs\Python\Python312"
          & $installerPath /quiet InstallLauncherAllUsers=0 TargetDir="$userPythonDir"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python installer failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Check Python Installation
        shell: pwsh
        run: |
          $pythonExe = "$env:USERPROFILE\AppData\Local\Programs\Python\Python312\python.exe"
          if (Test-Path $pythonExe) {
            Write-Host "Python executable found at $pythonExe"
            & $pythonExe --version
          } else {
            Write-Error "Python was not installed at $pythonExe"
            exit 1
          }
