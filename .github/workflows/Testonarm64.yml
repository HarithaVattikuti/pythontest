name: Install and Verify Python 3.12.10 arm64

on:
  workflow_dispatch:

jobs:
  install-python-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Download Python 3.12.10 arm64 installer
        run: |
          curl -O https://www.python.org/ftp/python/3.12.10/python-3.12.10-arm64.exe

      - name: Install Python 3.12.10 arm64
        shell: pwsh
        run: |
          $installer = "python-3.12.10-arm64.exe"
          $installDir = "C:\Python312"
          # Install silently for all users to a specific directory
          Start-Process -FilePath $installer -ArgumentList "/quiet InstallAllUsers=1 TargetDir=$installDir" -Wait
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python installer failed with exit code $LASTEXITCODE"
            exit 1
          }
          # .\$installer /quiet InstallAllUsers=1 TargetDir=$installDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python installer failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Check Python Installation
        shell: pwsh
        run: |
          $pythonExe = "C:\Python312\python.exe"
          if (Test-Path $pythonExe) {
            Write-Host "Python executable found at $pythonExe"
            & $pythonExe --version
          } else {
            Write-Error "Python was not installed at $pythonExe"
            exit 1
          }
