name: Validate nightly job

on:
  workflow_dispatch

jobs:
  setup-pypy:
    name: Setup PyPy ${{ matrix.pypy }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        pypy:
          - 'pypy-3.7'
          - 'pypy3.9'
          - 'pypy-3.7-nightly'
          - 'pypy-3.8-nightly'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5 
        with:
          python-version: ${{ matrix.pypy }} 
