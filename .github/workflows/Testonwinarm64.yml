name: Test python on Windows arm64

on:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        vers: ['3.13.7','3.13.8','3.13.5','3.12.10','3.12.9','3.11','3.10','3.14','3.15']
        os: ['windows-11-arm']
    steps:
      - uses: actions/checkout@v6   
      
      - uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.vers}}
          architecture: 'arm64'
