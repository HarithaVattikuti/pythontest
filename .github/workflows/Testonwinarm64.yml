name: Test python on Windows arm64

on:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        vers: ['3.12.0','3.12.1','3.12.2','3.12.3','3.12.4','3.12.5','3.12.6','3.12.7','3.12.8','3.12.9','3.12.10','3.13.0','3.13.1','3.13.2','3.13.3','3.13.4','3.13.5','3.13.6','3.13.7','3.13.8','3.13.9','3.13.10','3.13.11','3.13.11t','3.13.12','3.13.12t','3.14.0','3.14.1','3.14.2','3.14.2t','3.14.3','3.14.3t','3.14.0-rc.1','3.15.0-alpha.1']
        os: ['windows-11-arm']
    steps:
      - uses: actions/checkout@v6   
      
      - uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.vers}}
          architecture: 'arm64'
