name: Test versions on arm runners

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm,ubuntu-22.04-arm]
        
    steps:
      - name: Ensure jammy updates/security are enabled and install libbz2-1.0
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
      
          # Show OS/arch
          lsb_release -a || true
          dpkg --print-architecture
      
          # Refresh package indexes (ensures updates/security are visible)
          sudo apt-get update
      
          # Show all candidate versions apt can see
          apt-cache policy libbz2-1.0
      
          # Install/upgrade to the candidate version from enabled repos
          sudo apt-get install -y --only-upgrade libbz2-1.0
      
          # Verify installed version
          dpkg -s libbz2-1.0 | sed -n 's/^Version: //p'
          dpkg -l | awk '$2=="libbz2-1.0"{print}'
  
  testversion:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm,ubuntu-22.04-arm]
        
    steps:

      - name: Enable jammy-updates and jammy-security (arm64 ports)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
      
          # Show current sources for debugging
          echo "== Before =="
          grep -R --no-messages -nE '^(deb|Types:|URIs:|Suites:|Components:)' \
            /etc/apt/sources.list /etc/apt/sources.list.d/* || true
      
          # If the runner uses the newer deb822 source format (common), ensure it includes updates+security
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            # Add jammy-updates and jammy-security to the Suites line if missing
            sudo sed -i -E \
              's/^(Suites:.*jammy)(.*)$/\1 jammy-updates jammy-security\2/' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
      
          # If the runner uses classic sources.list, ensure updates+security entries exist
          if [ -f /etc/apt/sources.list ]; then
            # Append entries only if they don't exist already
            grep -qE 'ubuntu-ports jammy-updates' /etc/apt/sources.list || echo "deb http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
            grep -qE 'ubuntu-ports jammy-security' /etc/apt/sources.list || echo "deb http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          fi
      
          sudo apt-get update
      
          echo "== After =="
          apt-cache policy libbz2-1.0
          
      - name: Show available libbz2-1.0 versions after apt update
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          apt-cache policy libbz2-1.0
          apt-cache madison libbz2-1.0 || true
      
          # Show the exact origin pocket for the candidate (if it changes)
          apt-cache policy libbz2-1.0 | sed -n '1,120p'
          
      - name: Install required libbz2-1.0 version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y libbz2-1.0=1.0.8-5.1build0.1
          dpkg -s libbz2-1.0 | sed -n 's/^Version: //p'
