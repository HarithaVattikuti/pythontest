name: Test versions on arm runners

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm,ubuntu-22.04-arm]
        
    steps:
      - name: Ensure jammy updates/security are enabled and install libbz2-1.0
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
      
          # Show OS/arch
          lsb_release -a || true
          dpkg --print-architecture
      
          # Refresh package indexes (ensures updates/security are visible)
          sudo apt-get update
      
          # Show all candidate versions apt can see
          apt-cache policy libbz2-1.0
      
          # Install/upgrade to the candidate version from enabled repos
          sudo apt-get install -y --only-upgrade libbz2-1.0
      
          # Verify installed version
          dpkg -s libbz2-1.0 | sed -n 's/^Version: //p'
          dpkg -l | awk '$2=="libbz2-1.0"{print}'
  
  testversion:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm,ubuntu-22.04-arm]
        
    steps:
      - uses: actions/checkout@v4

      - name: Show OS / kernel / toolchain versions
        shell: bash
        run: |
          set -euxo pipefail
          echo "== OS =="
          cat /etc/os-release
          uname -a

          echo "== gcc / ld / make =="
          gcc --version || true
          ld --version || true
          make --version || true

      - name: Show bzip2 packages installed (runtime + dev) and available versions
        shell: bash
        run: |
          set -euxo pipefail
          echo "== Installed packages =="
          dpkg -l | awk '/bz2|libbz2/ {print}'

          echo "== Apt policy (what versions are available) =="
          apt-cache policy bzip2 libbz2-1.0 libbz2-dev || true
          
      # - name: Update OS packages and install bz2 deps (22.04 only)
      #   if: startsWith(matrix.os, 'ubuntu-22.04')
      #   shell: bash
      #   run: |
      #     set -euxo pipefail
      #     sudo apt-get update
      #     sudo apt-get upgrade -y
      #     sudo apt-get install -y --no-install-recommends \
      #       bzip2 libbz2-1.0 libbz2-dev
      
      #     echo "== bzip2/libbz2 versions =="
      #     apt-cache policy bzip2 libbz2-1.0 libbz2-dev

      - name: Verify _bz2 is linked to custom libbz2 (ubuntu-22.04 only)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        shell: bash
        run: |
          set -euxo pipefail
          mod_path="$(./python -c 'import _bz2; print(_bz2.__file__)')"
          echo "_bz2 extension: $mod_path"
          ldd "$mod_path" | grep -E 'libbz2|not found' || true
