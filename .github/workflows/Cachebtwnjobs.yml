name: Cache Between Jobs Example

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  
jobs:
  cache-file-job:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Create a file to cache
    - name: Create file to cache
      run: |
        mkdir -p cache-dir
        echo "This is cached data from Job 1" > cache-dir/cached-file.txt

    # Step 3: Save the file to cache
    - name: Save cache
      uses: actions/cache@v4
      with:
        path: cache-dir/cached-file.txt
        key: cache-example-${{ github.run_id }}

  restore-file-job:
    runs-on: ubuntu-latest
    needs: cache-file-job

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Restore the cached file
    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: restored-dir/cached-file.txt
        key: cache-example-${{ github.run_id }}

    # Step 3: Use the restored file
    - name: Use the restored file
      run: |
        if [ -f restored-dir/cached-file.txt ]; then
          echo "Cache restored successfully! Content of file:"
          cat restored-dir/cached-file.txt
        else
          echo "Cache not found."
        fi
