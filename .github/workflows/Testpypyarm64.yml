
name: Test pypy arm64

on:  
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.10"]
        os: [ windows-latest, macos-latest, ubuntu-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: |
          python --version --version


  buildfix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.10"]
        os: [ windows-latest, macos-latest, ubuntu-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: mayeut/setup-python@pypy-aarch64
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: |
          python --version --version
          
  check-non-eol:
    name: Check non-eol ${{ matrix.pypy }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - macos-15
          - windows-2019
          - windows-2022
          - windows-2025
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
        pypy: ['pypy-2.7', 'pypy-3.10']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-python ${{ matrix.pypy }}
        id: setup-python
        uses: mayeut/setup-python@pypy-aarch64
        with:
          python-version: ${{ matrix.pypy }}

      - name: Check python-path
        run: ./check-python-path.sh '${{ steps.setup-python.outputs.python-path }}'
        shell: bash

      - name: PyPy and Python version
        run: python --version

      - name: Run simple code
        run: python -c 'import math; print(math.factorial(5))'

      - name: Assert PyPy is running
        run: |
          import platform
          assert platform.python_implementation().lower() == "pypy"
        shell: python

      - name: Assert expected binaries (or symlinks) are present
        run: |
          EXECUTABLE=${{ matrix.pypy }}
          EXECUTABLE=${EXECUTABLE/pypy-/pypy}  # remove the first '-' in "pypy-X.Y" -> "pypyX.Y" to match executable name
          EXECUTABLE=${EXECUTABLE%%-*}  # remove any -* suffixe
          ${EXECUTABLE} --version
        shell: bash
