name: Test Python Tk
on:
  workflow_dispatch:

jobs:
  tests-poetry:
    strategy:
      matrix:
        os: [macos-13, macos-latest]
        python-version: ["3.10.10", "3.10.11"]
      fail-fast: false
    name: ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
     
      - name: Install Tkinter
        run: brew install python-tk@3.13

      - name: Set environment variables for Tkinter
        run: |
          export TK_LIBRARY=$(brew --prefix)/lib
          export TCL_LIBRARY=$(brew --prefix)/lib
          export PYTHON_CONFIGURE_OPTS="--with-tcltk-includes='-I/usr/local/opt/tcl-tk/include' --with-tcltk-libs='-L/usr/local/opt/tcl-tk/lib -ltcl8.6 -ltk8.6' --enable-shared"
          
      - name: Run tk script
        run: python tk_min.py
