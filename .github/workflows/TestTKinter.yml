name: Test Python Tk
on:
  workflow_dispatch:

jobs:
  tests-poetry:
    strategy:
      matrix:
        os: [macos-13]
        python-version: ["3.10.10", "3.10.11","3.9.19"]
      fail-fast: false
    name: ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: HarithaVattikuti/setup-python@testtcl
        with:
          python-version: ${{ matrix.python-version }}
     
