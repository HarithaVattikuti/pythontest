name: Run PowerShell Script

on: 
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find Python Path 
        run: |
          echo "Finding full Python path..."
          PYTHON_PATH=$(readlink -f $(which python3))
          echo "Python full path is: $PYTHON_PATH"
          echo "RUNNER_TOOL_CACHE=$PYTHON_PATH" >> $GITHUB_ENV
      
      - name: Verify Python Path
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
        
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Find Python Path from Tool Cache
        run: |
          npm install @actions/tool-cache
          node find-python.js

      - name: Verify Python Path
        run: |
          echo "Python full path: $PYTHON_PATH"
        
