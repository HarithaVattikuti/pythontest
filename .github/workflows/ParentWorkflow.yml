name: Calling workflow

on:
  workflow_dispatch:
  
jobs:
  call-reusable:
    uses: HarithaVattikuti/java-test/.github/workflows/reusable.yml@main
    secrets:
      token: ${{ secrets.PAT }}

  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub REST API to trigger workflow in another repo
        env:
          GH_TOKEN: ${{ secrets.PAT }}               # Store your PAT in repository secrets as PAT
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/HarithaVattikuti/java-test/actions/workflows/reusable.yml/dispatches \
            -d '{"ref":"main", "inputs": {}}'
