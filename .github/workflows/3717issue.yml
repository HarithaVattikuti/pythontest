name: Issue on 3717

on: 
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7.16", "3.7.17","3.6"]
        os: ["macos-13","ubuntu-22.04","ubuntu-24.04"] #It already worked on "ubuntu-latest"
    runs-on: ${{matrix.os}}
    steps:
   # - uses: actions/setup-python@v5
    - uses: HarithaVattikuti/setup-python@main
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ncurses
      run: brew install ncurses readline
    - run: python -c 'import readline'
