name: Python pip cache testing latest version

on:
  workflow_dispatch:

jobs:
  cachepip:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: "windows-latest"
            architecture: "x64"
          - os: "ubuntu-latest"
            architecture: "x64"
          - os: "ubuntu-20.04"
            architecture: "x64"
          - os: "ubuntu-24.04"
            architecture: "x64"
          - os: "windows-latest"
            architecture: "x86"
          - os: "macos-latest"
            architecture: "arm64"
          - os: "macos-12"
            architecture: "x64"
          - os: "macos-13"
            architecture: "x64"
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: 3.11
          architecture: ${{ matrix.target.architecture }}
          cache: "pip"
      #- name: Install dependencies
      #  run: |
     #    python -m pip install --upgrade pip
     #    pip install -r requirements.txt


  buildpipenv:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: enabled

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pipenv"

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel

      - name: Install dependencies
        run: |
          pipenv install --deploy --dev --verbose
