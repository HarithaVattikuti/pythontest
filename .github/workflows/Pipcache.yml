name: Python pip cache testing latest version

on:
  workflow_dispatch:

jobs:
  cachepip:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: "windows-latest"
            architecture: "x64"
          - os: "ubuntu-latest"
            architecture: "x64"
          - os: "ubuntu-24.04"
            architecture: "x64"
          - os: "windows-latest"
            architecture: "x86"
          - os: "macos-latest"
            architecture: "arm64"
          - os: "macos-13"
            architecture: "x64"
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: aparnajyothi-y/setup-python@update-error-to-warning
        id: setup-python
        with:
          python-version: 3.11
          architecture: ${{ matrix.target.architecture }}
          cache: "pip"
      #- name: Install dependencies
      #  run: |
     #    python -m pip install --upgrade pip
     #    pip install -r requirements.txt


  buildpipenv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest","ubuntu-latest","macos-13","macos-latest","windows-11-arm","ubuntu-22.04-arm"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: aparnajyothi-y/setup-python@update-error-to-warning
        with:
          python-version: "3.9"
          cache: "pipenv"

