name: Test ubuntu slim

on:
  workflow_dispatch:
 
jobs:
  build-host-:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14","3.12"]
        os: ["ubuntu-slim","ubuntu-22.04","ubuntu-24.04"] 
    runs-on: ${{matrix.os}}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: ${{matrix.python-version}} 

    
